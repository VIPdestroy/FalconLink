<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FalconLink</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Freeman&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/global/navbar.css" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="/w3.css">
  <script src="https://cdn.jsdelivr.net/npm/vanilla-lazyload@19.1.3/dist/lazyload.min.js"></script>
  <script src="/uv/uv.bundle.js" defer></script>
  <script src="/uv/uv.config.js" defer></script>
  <script src="/register-sw.js" defer></script>
  <script src="openGame.js" defer></script>
  <script src="/global/all.js" defer></script>
</head>

<body onload="load()">

  <div style="display: none" id="myDiv">
    <div id="proxy-div" class="hide-proxy-div">
      <iframe id="uv-frame"></iframe>
    </div>

    <div class="w3-display-container navbar-container">
      <a href="/" class="w3-display-left"><img class="navbar-logo" src="/falconlink_logo.png" alt="FalconLink Logo"></a>
      <div class="w3-display-right">
        <a href="/games" class="navbar-link"><i class="fa fa-gamepad navbar-icon" aria-hidden="true"></i></a>
      </div>
    </div>

    <div class="main-div">
      <p class="title">GAMES</p>
      <input type="text" placeholder="Search" id="games-search-bar" class="w3-input w3-round-large search-bar" oninput="searchGames(this)">
      <div class="pages"><b class="switch-page" onclick="currentPage -= 1; setGames(currentPage); setPageArrows()">< LAST</b><b class="page-number">1</b><b class="switch-page" onclick="currentPage += 1; setGames(currentPage); setPageArrows()">NEXT ></b></div>
      <div id="games-container">
        <h1>LOADING...</h1>
      </div>
      <div class="pages"><b class="switch-page" onclick="currentPage -= 1; setGames(currentPage); setPageArrows(); scrollToTopOfGames()">< LAST</b><b class="page-number">1</b><b class="switch-page" onclick="currentPage += 1; setGames(currentPage); setPageArrows(); scrollToTopOfGames()">NEXT ></b></div>
    </div>

    <script src="loadGames.js"></script>
  </div>

  <div class="loadcenter">
    <div class="loading-container" id="hide">
      <div class="loading-text">
        <span>L</span>
        <span>O</span>
        <span>A</span>
        <span>D</span>
        <span>I</span>
        <span>N</span>
        <span>G</span>
      </div>
    </div>
  </div>

</body>

</html>
